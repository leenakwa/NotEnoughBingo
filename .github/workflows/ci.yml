name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  foundation:
    name: Foundation configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify the complete user readiness checklist
        run: python3 infra/scripts/verify-readiness-checklist.py

      - name: Verify isolated release rehearsal boundaries
        run: python3 -m unittest discover -s infra/scripts -p 'test_rehearse_mixed_release.py' -v

      - name: Verify retained frontend asset boundaries
        run: python3 -m unittest discover -s infra/scripts -p 'test_retain_frontend_assets.py' -v

      - name: Validate Compose model
        run: |
          set -o pipefail
          docker compose --env-file .env.example config --quiet
          COMPOSE_FILE=compose.yml docker compose --env-file .env.example config --quiet
          FRONTEND_ASSET_DIR=/tmp/neb-frontend-assets docker compose --env-file .env.example \
            -f compose.yml -f compose.frontend-assets.yml config --quiet
          COMPOSE_FILE=compose.yml docker compose --env-file .env.example config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["minio-init"]["command"][0])' \
            | sh -n

      - name: Validate shell scripts
        run: |
          shellcheck infra/scripts/*.sh infra/minio/*.sh
          bash -n infra/scripts/*.sh infra/minio/*.sh

      - name: Validate infrastructure documents and Nginx syntax
        run: |
          python3 -m json.tool infra/minio/lifecycle.json >/dev/null
          python3 -m json.tool infra/minio/media-service-policy.json >/dev/null
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -e NGINX_CLIENT_MAX_BODY_SIZE=16m \
            -e NGINX_TRUSTED_PROXY_CIDR=10.0.0.0/8 \
            -e NGINX_FORWARDED_PROTO=https \
            -e NGINX_ADMIN_ALLOW_CIDR=192.0.2.0/24 \
            -e NGINX_HSTS_SECONDS=300 \
            -e NGINX_AUTH_BURST=5 \
            -e 'NGINX_ENVSUBST_FILTER=^(NGINX_CLIENT_MAX_BODY_SIZE|NGINX_TRUSTED_PROXY_CIDR|NGINX_FORWARDED_PROTO|NGINX_ADMIN_ALLOW_CIDR|NGINX_HSTS_SECONDS|NGINX_AUTH_BURST)$' \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            "nginx:$(awk -F= '/^NGINX_IMAGE_TAG=/{print $2}' .env.example)" \
            nginx -T > /tmp/nginx-rendered.txt 2>&1
          grep -F 'set_real_ip_from 10.0.0.0/8;' /tmp/nginx-rendered.txt
          grep -F "proxy_set_header X-Forwarded-For \$remote_addr;" /tmp/nginx-rendered.txt
          grep -F 'proxy_set_header X-Forwarded-Proto https;' /tmp/nginx-rendered.txt
          grep -F 'allow 192.0.2.0/24;' /tmp/nginx-rendered.txt
          if grep -F "\$proxy_add_x_forwarded_for" /tmp/nginx-rendered.txt; then
            echo 'Nginx must replace, not append to, forwarded client chains' >&2
            exit 1
          fi

      - name: Validate Make targets
        run: make -n config backup-db

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan committed history with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose /repo

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: not_enough_bingo_test
          POSTGRES_USER: not_enough_bingo
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U not_enough_bingo -d not_enough_bingo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DEBUG: "false"
      DJANGO_SECRET_KEY: ci-test-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      DATABASE_URL: postgresql://not_enough_bingo:test-only-password@127.0.0.1:5432/not_enough_bingo_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1
          python -m pip check

      - name: Audit production Python dependency graph
        run: pip-audit -r requirements.lock --progress-spinner=off

      - name: Audit installed Gunicorn against OSV
        run: |
          audit_dir="$(mktemp -d /tmp/neb-gunicorn-audit.XXXXXX)"
          trap 'rm -rf "$audit_dir"' EXIT
          python - "$audit_dir/requirements.txt" <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          Path(sys.argv[1]).write_text(f"gunicorn=={version('gunicorn')}\n")
          PY
          pip-audit --vulnerability-service osv --no-deps --disable-pip \
            --progress-spinner=off --format=json -r "$audit_dir/requirements.txt" \
            > "$audit_dir/result.json"
          python - "$audit_dir/result.json" <<'PY'
          from importlib.metadata import version
          import json
          from pathlib import Path
          import sys

          dependencies = json.loads(Path(sys.argv[1]).read_text())["dependencies"]
          assert len(dependencies) == 1, "OSV must audit exactly one dependency"
          dependency = dependencies[0]
          assert dependency.get("name") == "gunicorn", "OSV must audit Gunicorn"
          assert dependency.get("version") == version("gunicorn"), "OSV version mismatch"
          assert "skip_reason" not in dependency, "OSV must not skip Gunicorn"
          assert dependency.get("vulns") == [], "Gunicorn vulnerabilities missing or found"
          print(f"OSV audited gunicorn=={dependency['version']} with no known vulnerabilities")
          PY

      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy .

      - name: Check migrations
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular --validate --file /tmp/openapi.yaml
          diff -u openapi.yaml /tmp/openapi.yaml

      - name: Run backend tests
        # Export tests exercise native shaping and the same font families as the worker.
        # Install rather than skip multilingual coverage on the Python-only runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            pango1.0-tools fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
          pytest --cov=apps --cov=config --cov-report=term-missing

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_CSRF_COOKIE_NAME: neb_csrf
      API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production npm dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Verify generated API types are current
        run: |
          npm run api:types
          git diff --exit-code -- lib/api/schema.d.ts

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run component and integration tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  e2e:
    name: Browser smoke tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    needs:
      - frontend
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile
          - firefox
          - webkit
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_CSRF_COOKIE_NAME: neb_csrf
      API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Playwright smoke tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  live-e2e:
    name: Full-stack product flows
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - container-images
    timeout-minutes: 45
    env:
      CI: "true"
      E2E_LIVE: "1"
      APP_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
      COMPOSE_FILE: compose.yml:compose.s3-emulator.yml
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      MAILPIT_BASE_URL: http://localhost:8025
      NEXT_PUBLIC_CSRF_COOKIE_NAME: neb_csrf
      # Browser scenarios share one CI source IP across many synthetic users.
      # Production defaults and scoped throttle behavior are covered separately.
      ANON_RATE_LIMIT: 600/m
      AUTH_LOGIN_RATE_LIMIT: 30/m
      NGINX_AUTH_BURST: "30"
      AGENTATION_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the guarded optimized frontend image
        uses: actions/download-artifact@v8
        with:
          name: optimized-preview-frontend-image-${{ github.sha }}
          path: ${{ runner.temp }}/optimized-preview-image

      - name: Configure local full-stack environment
        run: cp .env.example .env

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and live browsers
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Build development application images
        run: docker compose build backend frontend

      - name: Start stateful dependencies
        run: |
          docker compose up -d --wait --wait-timeout 180 postgres redis minio mailpit
          docker compose run --rm --no-deps minio-init

      - name: Apply migrations and start application services
        run: |
          docker compose run --rm --no-deps backend python manage.py migrate --noinput
          docker compose up -d --wait --wait-timeout 240 backend worker beat frontend proxy

      - name: Verify optimized frontend guest SSR and hydration on the live backend
        timeout-minutes: 15
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
          IMAGE_ARTIFACT_DIR: ${{ runner.temp }}/optimized-preview-image
        run: |
          python3 infra/scripts/verify-optimized-preview-runtime.py run \
            --artifact-dir "$IMAGE_ARTIFACT_DIR" --expected-release "$EXPECTED_RELEASE"

      - name: Run live Playwright product flows
        working-directory: frontend
        run: >-
          npm run test:e2e --
          --project=live-chromium
          --project=live-mobile-webkit
          --project=live-firefox-compat
          --project=live-webkit-compat
          --project=live-android-compat

      - name: Verify compression of public API responses
        run: |
          headers=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            --header 'Accept-Encoding: gzip' \
            http://localhost:8080/api/v1/feeds/discover/)
          printf '%s\n' "$headers" | grep -qi '^Content-Encoding: gzip'

      - name: Verify proxy outage recovery and private query redaction
        run: bash infra/scripts/verify-proxy-recovery.sh

      - name: Capture application logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=500 frontend backend worker proxy mailpit minio

      - name: Upload live Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload optimized preview Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: optimized-preview-playwright-report
          path: frontend/optimized-preview-playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload optimized preview results and runtime provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: optimized-preview-test-results
          path: |
            frontend/optimized-preview-test-results/
            frontend/optimized-preview-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop full-stack services
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  container-images:
    name: Production image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            build_args: ""
          - name: frontend
            context: frontend
            build_args: |
              NEXT_PUBLIC_APP_URL=https://ci.not-enough-bingo.invalid
              NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
              NEXT_PUBLIC_API_BASE_URL=/api/v1
              NEXT_PUBLIC_CSRF_COOKIE_NAME=neb_csrf
              NEXT_PUBLIC_SUPPORT_EMAIL=support@example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: production
          pull: true
          no-cache-filters: production
          push: false
          load: true
          tags: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args }}

      - name: Verify rendered metadata from the production frontend image
        if: ${{ matrix.name == 'frontend' }}
        timeout-minutes: 5
        env:
          IMAGE_REF: not-enough-bingo-frontend:${{ github.sha }}
          EXPECTED_RELEASE: ${{ github.sha }}
          EXPECTED_ORIGIN: https://ci.not-enough-bingo.invalid
        run: |
          python3 infra/scripts/verify-frontend-metadata.py \
            --image "$IMAGE_REF" --expected-release "$EXPECTED_RELEASE" \
            --expected-origin "$EXPECTED_ORIGIN"

      - name: Export and validate immutable frontend assets
        if: ${{ matrix.name == 'frontend' }}
        env:
          IMAGE_REF: not-enough-bingo-frontend:${{ github.sha }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          asset_dir="$(mktemp -d)"
          trap 'rm -rf "$asset_dir"' EXIT
          image_id="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
          python3 infra/scripts/retain-frontend-assets.py \
            --image "$image_id" --release "$EXPECTED_RELEASE" \
            --asset-dir "$asset_dir" --max-bytes 268435456

      - name: Verify the production process is non-root
        env:
          IMAGE_REF: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
        run: |
          configured_user="$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')"
          case "$configured_user" in
            ""|0|root|0:*|root:*)
              echo "Production image must configure a non-root user; got '$configured_user'" >&2
              exit 1
              ;;
          esac

      - name: Verify backend defaults to production settings and rejects unsafe startup
        if: ${{ matrix.name == 'backend' }}
        env:
          IMAGE_REF: not-enough-bingo-backend:${{ github.sha }}
        run: |
          settings_module="$(docker image inspect "$IMAGE_REF" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^DJANGO_SETTINGS_MODULE=//p')"
          if [ "$settings_module" != config.settings.production ]; then
            echo 'Backend production image must default to production settings' >&2
            exit 1
          fi
          startup_log="$(mktemp)"
          trap 'rm -f "$startup_log"' EXIT
          if docker run --rm --network none --entrypoint python \
            -e APP_ENVIRONMENT=production -e DEBUG=false -e ALLOWED_HOSTS='*' \
            -e DATABASE_URL=sqlite:///:memory: -e USE_S3=false \
            "$IMAGE_REF" -m gunicorn config.wsgi:application \
            --config python:config.gunicorn --check-config >"$startup_log" 2>&1; then
            echo 'Backend production image accepted unsafe startup configuration' >&2
            exit 1
          fi
          if ! grep -Fq 'ALLOWED_HOSTS must be explicit and cannot contain a wildcard' "$startup_log"; then
            cat "$startup_log" >&2
            echo 'Backend startup did not reject configuration through production guards' >&2
            exit 1
          fi

      - name: Verify backend anonymous auth rejection and cache headers over HTTP
        if: ${{ matrix.name == 'backend' }}
        timeout-minutes: 3
        env:
          IMAGE_REF: not-enough-bingo-backend:${{ github.sha }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          python3 infra/scripts/verify-backend-auth-cache.py \
            --image "$IMAGE_REF" \
            --expected-release "$EXPECTED_RELEASE"

      - name: Verify embedded frontend release and reject runtime relabeling
        if: ${{ matrix.name == 'frontend' }}
        env:
          IMAGE_REF: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --entrypoint node "$IMAGE_REF" scripts/validate-production-env.mjs
          if docker run --rm --entrypoint node \
            -e NEXT_PUBLIC_APP_RELEASE=0000000000000000000000000000000000000000 \
            "$IMAGE_REF" scripts/validate-production-env.mjs; then
            echo 'Frontend image accepted a release different from its embedded build' >&2
            exit 1
          fi

      - name: Reject public source maps and sensitive files
        if: ${{ matrix.name == 'frontend' }}
        env:
          IMAGE_REF: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_REF" -eu -c '
            exposed="$(find /app/public /app/.next/static \
              \( -name .git -o -name .env -o -name ".env.*" -o \
                 -name "*.map" -o -name "*.db" -o -name "*.sqlite*" -o \
                 -name "*.dump" -o -name "*.sql" -o -name "*.pem" -o \
                 -name "*.key" -o -name "*.log" \) -print)"
            if [ -n "$exposed" ]; then
              printf "Disallowed public files in production image:\n%s\n" "$exposed" >&2
              exit 1
            fi
          '

      - name: Scan production image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: not-enough-bingo-${{ matrix.name }}:${{ github.sha }}
          artifact-name: not-enough-bingo-${{ matrix.name }}-${{ github.sha }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Export the guarded optimized frontend image and provenance
        if: ${{ matrix.name == 'frontend' }}
        timeout-minutes: 10
        env:
          IMAGE_REF: not-enough-bingo-frontend:${{ github.sha }}
          EXPECTED_RELEASE: ${{ github.sha }}
          IMAGE_ARTIFACT_DIR: ${{ runner.temp }}/optimized-preview-image
        run: |
          python3 infra/scripts/verify-optimized-preview-runtime.py export \
            --image "$IMAGE_REF" --artifact-dir "$IMAGE_ARTIFACT_DIR" \
            --expected-release "$EXPECTED_RELEASE"

      - name: Upload optimized frontend image for live preview checks
        if: ${{ matrix.name == 'frontend' }}
        uses: actions/upload-artifact@v7
        with:
          name: optimized-preview-frontend-image-${{ github.sha }}
          path: ${{ runner.temp }}/optimized-preview-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - foundation
      - secret-scan
      - backend
      - frontend
      - e2e
      - live-e2e
      - container-images
    steps:
      - name: Require every launch check to pass
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          LIVE_E2E_RESULT: ${{ needs.live-e2e.result }}
          CONTAINER_IMAGES_RESULT: ${{ needs.container-images.result }}
        run: |
          failures=0
          for requirement in \
            "foundation=$FOUNDATION_RESULT" \
            "secret-scan=$SECRET_SCAN_RESULT" \
            "backend=$BACKEND_RESULT" \
            "frontend=$FRONTEND_RESULT" \
            "e2e=$E2E_RESULT" \
            "live-e2e=$LIVE_E2E_RESULT" \
            "container-images=$CONTAINER_IMAGES_RESULT"
          do
            job_name="${requirement%%=*}"
            result="${requirement#*=}"
            if [ "$result" != "success" ]; then
              echo "$job_name did not pass (result: $result)" >&2
              failures=1
            fi
          done
          exit "$failures"
