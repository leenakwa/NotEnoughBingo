# New local checkouts and CI use a maintained S3-compatible emulator because
# the archived MinIO Community images are no longer publicly pullable.
# Keep its data volume separate from existing local MinIO volumes.
services:
  minio:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -admin.ui=false
      - -master.telemetry=false
      - -bucket=${S3_BUCKET:-not-enough-bingo-local}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-neb-service}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-neb-service-local-change-me}
      S3_BUCKET: ${S3_BUCKET:-not-enough-bingo-local}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9333/cluster/status

  # The emulator creates its bucket at startup. Production uses provider
  # IAM/versioning/lifecycle controls, checked in the deployment runbook.
  minio-init:
    image: alpine:3.21
    entrypoint:
      - /bin/sh
      - -c
    command:
      - "true"

volumes:
  seaweedfs_data:
