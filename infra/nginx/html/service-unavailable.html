<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Temporarily unavailable · Not Enough Bingo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #0a0a0a; background: #fff; font: 16px/1.5 "Courier New", monospace; }
      main { width: min(100% - 40px, 640px); margin: 12vh auto; padding: 32px; border: 2px solid #0a0a0a; }
      .brand { margin: 0 0 40px; font-weight: bold; }
      h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); line-height: 1.15; overflow-wrap: anywhere; }
      p { max-width: 52ch; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border: 1px solid #0a0a0a; color: #0a0a0a; font-weight: bold; text-decoration: none; }
      a:first-child { color: #fff; background: #0a0a0a; }
      a:hover { text-decoration: underline; }
      a:focus-visible { outline: 3px solid #0a0a0a; outline-offset: 4px; }
      @media (max-width: 480px) { main { padding: 22px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Not Enough Bingo</p>
      <h1>This page is temporarily unavailable</h1>
      <p>We couldn’t load this page. Try again in a moment.</p>
      <nav aria-label="Recovery actions">
        <a href="">Try again</a>
        <a href="/discover">Go to Discover</a>
      </nav>
    </main>
  </body>
</html>
